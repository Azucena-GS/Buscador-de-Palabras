<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de palabras</title>
  <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
  <main>
    <header class="intro">
      <h1>Buscador de palabras</h1>
    </header>

    <section class="panel" aria-label="Búsqueda en texto">
      <form id="search-form" novalidate>
        <div>
          <label for="source-text">Texto</label>
          <textarea id="source-text" placeholder="Escribe o pega aquí el texto que quieres revisar..."></textarea>
        </div>

        <div class="search-field">
          <label for="search-term">Palabra o carácter a buscar</label>
          <input id="search-term" type="text" placeholder="Por ejemplo: palabra" autocomplete="off">
          <p class="hint">La búsqueda no distingue entre mayúsculas y minúsculas.</p>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Buscar</button>
          <button class="secondary" id="clear-button" type="button">Limpiar</button>
        </div>
      </form>

      <div class="alert" id="alert" role="alert" aria-live="assertive" hidden></div>
      <section class="results" id="results" aria-live="polite" hidden>
        <div class="result-heading">
          <h2>Texto procesado</h2>
          <span class="count" id="count"></span>
        </div>
        <p class="processed-text" id="processed-text"></p>
      </section>
    </section>
  </main>
<script src="./dist/script.js" defer></script>
</body>
</html>
